<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="50%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <linearGradient id="stickerGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#8B5CF6" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bgGrad)" stroke="url(#accentGrad)" stroke-width="8"/>

  <!-- Subtle grid dots pattern -->
  <circle cx="96" cy="96" r="3" fill="#4F46E5" opacity="0.4"/>
  <circle cx="144" cy="96" r="3" fill="#4F46E5" opacity="0.4"/>
  <circle cx="96" cy="144" r="3" fill="#4F46E5" opacity="0.4"/>
  <circle cx="416" cy="416" r="3" fill="#EC4899" opacity="0.4"/>
  <circle cx="368" cy="416" r="3" fill="#EC4899" opacity="0.4"/>
  <circle cx="416" cy="368" r="3" fill="#EC4899" opacity="0.4"/>

  <!-- Decorative sticker peel fold in top right -->
  <path d="M 400 32 L 480 112 L 400 112 Z" fill="#6366F1" opacity="0.8"/>
  <path d="M 400 32 L 480 112" stroke="#FFFFFF" stroke-width="3" opacity="0.6"/>

  <!-- Central FR Monogram Emblem -->
  <g filter="url(#glow)">
    <!-- Letter 'F' -->
    <path d="M 128 140 L 260 140 C 275 140, 280 155, 275 170 C 270 185, 255 190, 240 190 L 195 190 L 195 240 L 245 240 C 260 240, 265 255, 260 270 C 255 285, 240 290, 225 290 L 195 290 L 195 372 C 195 385, 185 395, 170 395 C 155 395, 145 385, 145 372 L 145 158 C 145 148, 150 140, 128 140 Z" 
          fill="url(#stickerGlow)"/>

    <!-- Letter 'R' with overlapping futuristic geometry -->
    <path d="M 270 140 L 360 140 C 405 140, 425 170, 420 215 C 415 255, 385 275, 345 280 L 405 365 C 412 375, 408 392, 395 395 C 382 398, 370 390, 362 380 L 310 300 L 290 300 L 290 372 C 290 385, 280 395, 265 395 C 252 395, 242 385, 242 372 L 242 160 C 242 148, 252 140, 270 140 Z M 290 190 L 290 250 L 350 250 C 372 250, 380 238, 382 220 C 384 202, 376 190, 350 190 Z" 
          fill="url(#accentGrad)"/>
  </g>

  <!-- Little smiling sticker wink badge -->
  <circle cx="195" cy="315" r="7" fill="#FDE047"/>
  <path d="M 320 345 Q 335 360 350 345" fill="none" stroke="#FDE047" stroke-width="4" stroke-linecap="round"/>

  <!-- Text "STICKERS HUB" pill bottom -->
  <rect x="136" y="420" width="240" height="42" rx="21" fill="#0F172A" stroke="url(#accentGrad)" stroke-width="2"/>
  <text x="256" y="448" font-family="'Outfit', sans-serif" font-weight="800" font-size="20" fill="#FFFFFF" text-anchor="middle" letter-spacing="3">STICKERS HUB</text>
</svg>
